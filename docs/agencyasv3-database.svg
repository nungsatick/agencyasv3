<text x="773" y="1327" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">central_contents ↔ files : central_contents_rels</text>
<text x="773" y="1363" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">central_contents_links → central_contents / files</text>
<text x="773" y="1399" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">announcements ↔ provinces : announcements_rels</text>
<text x="773" y="1435" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">announcements.image_id / provinces.hero_image_id → files</text>
<text x="773" y="1471" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">site_settings_footer_links → site_settings</text>
<rect x="1455" y="1245" width="675" height="265" rx="16" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
<text x="1473" y="1284" font-family="Tahoma,sans-serif" font-size="24" font-weight="700" fill="#c2410c">สถิติและประวัติ</text>
<text x="1473" y="1327" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">page_views → provinces : ยอดรายวัน / หน้า</text>
<text x="1473" y="1363" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">activity_logs → users / provinces : ประวัติใช้งาน</text>
<text x="1473" y="1399" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">cookie_consents : บันทึกความยินยอมแบบไม่ระบุตัวตน</text>
<text x="1473" y="1435" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">ตาราง _*_v : ประวัติเอกสาร / แดชบอร์ด / ประกาศ</text>
<text x="1473" y="1471" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">ตาราง payload_* : ข้อมูลภายใน CMS</text>
<rect x="55" y="1540" width="2075" height="100" rx="16" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
