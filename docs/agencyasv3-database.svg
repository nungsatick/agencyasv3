<text x="55" y="1693" font-family="Tahoma,sans-serif" font-size="19" font-weight="400" fill="#334155">หมายเหตุ: ไฟล์เดียวแนบได้หลายรายการผ่าน *_rels • FK บางช่องอนุญาต NULL เพื่อรองรับร่าง • ไม่แสดงทุกเส้นในภาพรวม</text>
<text x="55" y="1730" font-family="Tahoma,sans-serif" font-size="18" font-weight="400" fill="#64748b">อ้างอิง migration 20261014_143408_idle_sessions และ collections • ยังไม่ได้เทียบฐานข้อมูลที่กำลังรันจริง</text>
