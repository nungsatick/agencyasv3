<text x="73" y="1327" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">users ↔ provinces : ผ่าน users_rels (หลายต่อหลาย)</text>
<text x="73" y="1363" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">user_tokens → users : เจ้าของโทเคน / ผู้สร้าง</text>
<text x="73" y="1399" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">users_sessions / users_recovery_codes → users</text>
<text x="73" y="1435" font-family="Tahoma,sans-serif" font-size="17" font-weight="400" fill="#334155">session_activity.user_id → users.id : ไม่มี FK</text>
<rect x="755" y="1245" width="650" height="265" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
