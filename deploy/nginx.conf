# Example nginx site for the app behind docker-compose.yml (adjust server_name and certificates).

# Password and 2FA guessing: at most 10 sign-in requests a minute from one address (short bursts allowed).
# Accounts also lock for 15 minutes after 5 wrong tries, but that alone lets anyone lock the known
# accounts (admin_<province>) on purpose; this slows that down at the door.
limit_req_zone $binary_remote_addr zone=agy_signin:10m rate=10r/m;

server {
    listen 443 ssl http2;
    server_name agencyas.gdcatalog.go.th;

    # ssl_certificate     /etc/ssl/...;
    # ssl_certificate_key /etc/ssl/...;
    ssl_protocols TLSv1.2 TLSv1.3;

    # do not tell visitors which nginx version runs here
    server_tokens off;
    # browsers keep to https:// for a year (only once the certificate is working)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # document uploads (PDF, Excel, images)
    client_max_body_size 50m;

    location /api/users/sign-in {
        limit_req zone=agy_signin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name agencyas.gdcatalog.go.th;
    server_tokens off;
    return 301 https://$host$request_uri;
}
